<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--PAGE-START-->
<title>Green Raise Agro</title>
<link rel="icon" href="img/logo.jpg">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky control bar (files + period) over a tab strip; each tab is a summary row then one working table. */
:root{
  --bg:#f5f6f7; --surface:#ffffff; --surface-2:#eef0f2; --line:#dde1e5; --line-2:#c9ced4;
  --fg:#16191d; --fg-2:#4a525b; --fg-3:#6d757e;
  --accent:#3f7a22; --accent-soft:#e6f0dc; --accent-ink:#2c5717; --on-accent:#ffffff;
  --s-in:#1baf7a; --s-out:#2a78d6; --s-bal:#6250d6;
  --good:#0ca30c; --warn:#b97c00; --warn-bg:#fdf1d6; --serious:#c75a2c; --serious-bg:#fbe6dc; --crit:#d03b3b; --crit-bg:#fbe3e3; --good-bg:#e2f4e2; --info-bg:#e4eefa; --info:#2a5fa8;
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
  --side-bg:#19201a; --side-fg:#c5ccd3; --side-hi:#ffffff; --side-mute:#8a939c; --side-line:#2a332b; --side-hover:#232c24; --side-active:#23301f; --accent-side:#8cc152;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121416; --side-bg:#0d0f11; --side-line:#22272c; --side-hover:#1c2126; --side-active:#1f2a1b; --surface:#1a1d20; --surface-2:#23272b; --line:#2e3338; --line-2:#3d434a;
  --fg:#eceef0; --fg-2:#b5bcc3; --fg-3:#8c949c;
  --accent:#8cc152; --accent-soft:#223018; --accent-ink:#b3dc84; --on-accent:#13210b;
  --s-in:#199e70; --s-out:#3987e5; --s-bal:#9085e9;
  --good:#3cc23c; --warn:#e8a92a; --warn-bg:#3a2f14; --serious:#ec835a; --serious-bg:#3b2419; --crit:#ef6b6b; --crit-bg:#3d1d1d; --good-bg:#1b3320; --info-bg:#1b2a3d; --info:#8bb6ef;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121416; --side-bg:#0d0f11; --side-line:#22272c; --side-hover:#1c2126; --side-active:#1f2a1b; --surface:#1a1d20; --surface-2:#23272b; --line:#2e3338; --line-2:#3d434a;
  --fg:#eceef0; --fg-2:#b5bcc3; --fg-3:#8c949c;
  --accent:#8cc152; --accent-soft:#223018; --accent-ink:#b3dc84; --on-accent:#13210b;
  --s-in:#199e70; --s-out:#3987e5; --s-bal:#9085e9;
  --good:#3cc23c; --warn:#e8a92a; --warn-bg:#3a2f14; --serious:#ec835a; --serious-bg:#3b2419; --crit:#ef6b6b; --crit-bg:#3d1d1d; --good-bg:#1b3320; --info-bg:#1b2a3d; --info:#8bb6ef;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--f-body);margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1500px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:.01em}
h1{font-size:22px;font-weight:700}
h2{font-size:19px;font-weight:600}
h3{font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-2)}
.num,td.n,th.n{font-variant-numeric:tabular-nums;text-align:right}
.mono{font-family:var(--f-mono);font-size:12.5px}
.muted{color:var(--fg-3)}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* shell: fixed left menu + content column */
.shell{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--side-bg);color:var(--side-fg);display:flex;flex-direction:column;padding:14px 12px calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));border-right:1px solid var(--side-line);scrollbar-width:thin}
.side-brand{display:flex;align-items:center;gap:10px;padding:4px 6px 16px;border-bottom:1px solid var(--side-line);margin-bottom:10px}
.side-brand .logo{display:block;width:36px;height:36px;border-radius:8px;background:#fff;object-fit:contain;padding:3px;flex:none}
.side-brand b{display:block;font:600 17px/1.15 var(--f-display);color:var(--side-hi)}
.side-brand small{display:block;font-size:12px;color:var(--side-mute)}
.side-nav{display:grid;gap:2px;flex:1;align-content:start}
.side-group{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--side-mute);padding:14px 10px 6px}
.side-group:first-child{padding-top:4px}
.side-nav button{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:6px;color:var(--side-fg);font-size:14px;font-weight:500}
.side-nav button svg{flex:none;opacity:.75}
.side-nav button:hover{background:var(--side-hover);color:var(--side-hi)}
.side-nav button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.side-nav button[aria-current=page]{background:var(--side-active);color:var(--side-hi);box-shadow:inset 3px 0 0 var(--accent)}
.side-nav button[aria-current=page] svg{opacity:1;color:var(--accent-side)}
.side-nav .ct{margin-left:auto;font:500 11.5px/1.5 var(--f-mono);padding:0 6px;border-radius:10px;background:var(--side-hover);color:var(--side-fg)}
.side-nav .ct.hot{background:var(--crit);color:#fff}
.side-foot{border-top:1px solid var(--side-line);padding:12px 6px 0;margin-top:12px;display:grid;gap:8px}
.side-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--side-mute)}
.side .files{display:grid;gap:4px}
.side .chip{background:none;border:0;padding:0;color:var(--side-fg);font-size:12px;white-space:normal;display:flex;gap:6px;align-items:center}
.side .chip b{font-weight:600;color:var(--side-hi)}
.side .side-load{background:transparent;color:var(--side-fg);border-color:var(--side-line)}
.side .side-load:hover{border-color:var(--accent);color:var(--side-hi)}
.maincol{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding:12px max(24px,env(safe-area-inset-right,0px)) 12px 24px}
.ptitle{margin-right:auto;min-width:0}
.ptitle h1{font-size:22px;font-weight:600;line-height:1.15}
.crumb{font-size:11.5px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;color:var(--fg-3)}
.pright{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.ason{font-size:12px;color:var(--fg-3)}
.navbtn{display:none;border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px;line-height:0;color:var(--fg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.files{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:12.5px;background:var(--surface-2);white-space:nowrap}
.chip b{font-weight:600}
.chip.ok::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--good)}
.chip.miss::before{content:"";flex:none;width:7px;height:7px;border-radius:50%;background:var(--side-mute)}
.btn{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
:root[data-theme="dark"] .btn.pri{color:#1a1d20}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#1a1d20}}
.btn.sm{padding:3px 9px;font-size:12.5px}
.period{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px}
.period input[type=date],.period select,.tool input,.tool select,.set input,.set select{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:5px 8px;min-width:0}
.period label{color:var(--fg-3)}
main{padding:22px max(24px,env(safe-area-inset-right,0px)) 60px 24px;max-width:1440px;width:100%}
.sample .inner{padding:7px 24px}
.scrim{position:fixed;inset:0;background:rgb(0 0 0 / .4);z-index:39}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:min(280px,84vw);z-index:40;transform:translateX(-102%);transition:transform .2s ease;padding-top:calc(14px + env(safe-area-inset-top,0px))}
  .side.open{transform:none;box-shadow:0 0 40px rgb(0 0 0 / .35)}
  .navbtn{display:inline-flex}
  .topbar{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .sample .inner{padding-inline:16px}
  .pright{align-items:flex-start;width:100%}
  .ptitle h1{font-size:19px}
}
.view{display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px;min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;margin-bottom:10px}
.panel-h p{margin:0;color:var(--fg-3);font-size:13px;flex-basis:100%}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.lede{color:var(--fg-2);margin:0;max-width:80ch}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:11px 14px;text-align:left;display:grid;gap:2px;min-width:0}
button.kpi:hover{border-color:var(--accent)}
.kpi .l{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--fg-3)}
.kpi .v{font-family:var(--f-display);font-weight:600;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--fg-3)}
.kpi.crit .v{color:var(--crit)} .kpi.serious .v{color:var(--serious)} .kpi.warn .v{color:var(--warn)}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:1px 8px;border-radius:4px;white-space:nowrap}
.pill::before{font-size:9px}
.pill.crit{background:var(--crit-bg);color:var(--crit)} .pill.crit::before{content:"■"}
.pill.serious{background:var(--serious-bg);color:var(--serious)} .pill.serious::before{content:"▲"}
.pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.warn::before{content:"●"}
.pill.good{background:var(--good-bg);color:var(--good)} .pill.good::before{content:"✓"}
.pill.info{background:var(--info-bg);color:var(--info)} .pill.info::before{content:"i";font-style:italic;font-family:serif;font-size:11px}
.dir{font-size:12px;font-weight:500;white-space:nowrap}.dir::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}.dir.in::before{background:var(--s-in)}.dir.out::before{background:var(--s-out)}
dialog .kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr))}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:12px}
.seg button{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r);padding:8px 10px;text-align:left;display:grid;gap:2px;min-width:0}
.seg button span{font-size:12px;color:var(--fg-3)}
.seg button.on{border-color:var(--accent);background:var(--accent-soft)}
.egrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:10px;margin-bottom:10px}
#entryForm label{display:grid;gap:4px;font-size:13px;color:var(--fg-2)}
#entryForm input,#entryForm select,#entryForm textarea{border:1px solid var(--line-2);background:var(--surface);color:var(--fg);border-radius:var(--r);padding:7px 9px;font:inherit;min-width:0;width:100%}
#entryForm .full{margin-top:10px}
.elines{display:grid;gap:8px;margin:10px 0}
.eline{display:grid;grid-template-columns:minmax(0,1fr) 120px auto;gap:6px;align-items:center}
.eline .enHint{grid-column:1/-1;font-size:12.5px;margin-top:-2px}
.enote{background:var(--warn-bg);padding:8px 10px;border-radius:6px;font-size:13px;margin:0 0 6px}
.eerr{color:var(--crit);font-size:13px;margin:6px 0}
@media (max-width:640px){.seg{grid-template-columns:1fr}.eline{grid-template-columns:minmax(0,1fr) 90px auto}}
.pill.flat{background:var(--surface-2);color:var(--fg-2)}

/* toolbar + tables */
.tool{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.tool input[type=search]{flex:1 1 220px;max-width:340px}
.tool .sp{margin-left:auto;display:flex;gap:6px}
.tool label{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--fg-2)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:6px;max-height:70vh}
table{border-collapse:collapse;width:100%;font-size:13px}
th{position:sticky;top:0;background:var(--surface-2);z-index:1;text-align:left;font-weight:600;font-size:12px;color:var(--fg-2);border-bottom:1px solid var(--line-2);white-space:nowrap;padding:0}
th button{all:unset;cursor:pointer;display:block;padding:7px 9px;width:100%;box-sizing:border-box}
th.n button{text-align:right}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
th[aria-sort=ascending] button::after{content:" ▲";font-size:9px}
th[aria-sort=descending] button::after{content:" ▼";font-size:9px}
td{padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:hover td{background:var(--surface-2)}
td.item{white-space:normal;min-width:180px;max-width:320px}
a.il,button.il{all:unset;cursor:pointer;color:var(--fg);border-bottom:1px dotted var(--fg-3)}
a.il:hover,button.il:hover{color:var(--accent);border-bottom-color:var(--accent)}
button.il:focus-visible{outline:2px solid var(--accent)}
td.neg{color:var(--crit);font-weight:600}
tfoot td{font-weight:600;background:var(--surface-2);position:sticky;bottom:0}
.more{display:flex;gap:10px;align-items:center;padding:8px 2px 0;font-size:13px;color:var(--fg-3)}
.bar{display:inline-block;height:6px;border-radius:0 3px 3px 0;background:var(--s-out);vertical-align:middle;margin-left:6px}
.empty{padding:28px 10px;text-align:center;color:var(--fg-3)}

/* alerts */
.alerts{display:grid;gap:8px}
.alert{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start;padding:10px 12px;border-radius:6px;border:1px solid var(--line);background:var(--surface)}
.alert .t{font-weight:600}
.alert p{margin:2px 0 0;color:var(--fg-2);font-size:13px;max-width:95ch}
.alert .act{grid-column:2;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}

/* drop zone */
.drop{border:2px dashed var(--line-2);border-radius:10px;padding:26px 18px;text-align:center;background:var(--surface);display:grid;gap:10px;justify-items:center}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop ol{text-align:left;margin:0;padding-left:20px;color:var(--fg-2);max-width:70ch}
.loadpanel{margin-top:0}

.chartbox{position:relative;height:260px}
.chartbox.sm{height:220px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--fg-2);margin-bottom:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.matrix{display:grid;grid-template-columns:auto repeat(3,1fr);gap:4px;font-size:13px}
.matrix div{padding:8px;border-radius:4px;background:var(--surface-2);text-align:center;font-variant-numeric:tabular-nums}
.matrix .h{background:none;color:var(--fg-3);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.matrix button{all:unset;cursor:pointer;display:block;padding:8px;border-radius:4px;text-align:center;font-variant-numeric:tabular-nums;background:var(--surface-2)}
.matrix button:hover{outline:1px solid var(--accent)}

/* settings */
.set{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:14px}
.set label{display:grid;gap:4px;font-size:13px}
.set label span{color:var(--fg-3);font-size:12px}
.set input,.set select{width:100%}
textarea{width:100%;min-height:60px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--fg);font:12.5px var(--f-mono);padding:6px}

/* modal */
dialog{border:1px solid var(--line-2);border-radius:10px;padding:0;background:var(--bg);color:var(--fg);width:min(1100px,calc(100vw - 24px));max-height:calc(100vh - 40px)}
dialog::backdrop{background:rgb(0 0 0 / .45)}
.dlg-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;gap:12px;align-items:center;z-index:2}
.dlg-b{padding:16px;display:grid;gap:16px}
.toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:13px;z-index:50}
.sample{background:var(--warn-bg);color:var(--fg);border-bottom:1px solid var(--line)}
.sample{font-size:13px}
@media (max-width:640px){.kpi .v{font-size:24px}.top{position:static}.tw{max-height:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="shell">
<aside class="side" id="side" aria-label="Main menu">
  <div class="side-brand"><img class="logo" src="img/logo.jpg" alt=""><div><b>Green Raise Agro</b><small id="coName">Stock Control</small></div></div>
  <nav class="side-nav" id="tabs"></nav>
  <div class="side-foot">
    <div class="side-label">Data sources</div>
    <div class="files" id="fileChips"></div>
  </div>
</aside>
<div class="scrim" id="scrim" hidden></div>
<div class="maincol">
<header class="top">
  <div class="topbar">
    <button class="navbtn" id="navToggle" type="button" aria-label="Open menu" aria-controls="side" aria-expanded="false"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/></svg></button>
    <div class="ptitle"><div class="crumb" id="pageGroup"></div><h1 id="pageTitle">Overview</h1></div>
    <div class="pright"><div class="period" id="periodBar">
      <label for="pPreset" class="sr">Period</label>
      <select id="pPreset">
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
        <option value="180">Last 180 days</option>
        <option value="365">Last 365 days</option>
        <option value="month">This month</option>
        <option value="lmonth">Last month</option>
        <option value="fy">This financial year</option>
        <option value="lfy">Last financial year</option>
        <option value="all">All data</option>
        <option value="custom">Custom</option>
      </select>
      <label for="pFrom">From</label><input type="date" id="pFrom">
      <label for="pTo">To</label><input type="date" id="pTo">
      
    </div><span class="ason" id="asOn"></span></div>
  </div>
</header>
<div class="sample" id="sampleBar" hidden><div class="inner" id="sampleText"></div></div>
<main id="main"></main>
</div>
</div>

<dialog id="dlg"><div class="dlg-h"><h2 id="dlgTitle" style="margin-right:auto"></h2><button class="btn sm" id="dlgClose" type="button">Close</button></div><div class="dlg-b" id="dlgBody"></div></dialog>

<script>
"use strict";
/* ============================== helpers ============================== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad=n=>String(n).padStart(2,'0');
const dObj=d=>new Date(d*864e5);
const dstr=d=>{if(d==null||isNaN(d))return '–';const t=dObj(d);return pad(t.getUTCDate())+'-'+MON[t.getUTCMonth()]+'-'+String(t.getUTCFullYear()).slice(2)};
const iso=d=>dObj(d).toISOString().slice(0,10);
const fromIso=s=>Math.floor(Date.parse(s+'T00:00:00Z')/864e5);
const today=()=>{const t=new Date();return Math.floor(Date.UTC(t.getFullYear(),t.getMonth(),t.getDate())/864e5)};
const ym=d=>{const t=dObj(d);return t.getUTCFullYear()*12+t.getUTCMonth()};
const ymLabel=k=>MON[k%12]+'-'+String(Math.floor(k/12)).slice(2);
const ymStart=k=>Math.floor(Date.UTC(Math.floor(k/12),k%12,1)/864e5);
const nf=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2});
const nf0=new Intl.NumberFormat('en-IN',{maximumFractionDigits:0});
const fmt=(n,d)=>n==null||!isFinite(n)?'–':(d===0||Math.abs(n)>=1000?nf0:nf).format(n);
const fmtInt=n=>n==null||!isFinite(n)?'–':nf0.format(n);
const daysTxt=n=>n==null||!isFinite(n)?'–':n>999?'999+':fmtInt(n);
function toast(msg){const t=document.createElement('div');t.className='toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600)}
const store={
  get(k,def){try{const v=localStorage.getItem('gra.'+k);return v==null?def:JSON.parse(v)}catch(e){return def}},
  set(k,v){try{localStorage.setItem('gra.'+k,JSON.stringify(v))}catch(e){}}
};
const idb={
  open(){return new Promise((res,rej)=>{try{const r=indexedDB.open('gra-stock',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async get(k){try{const db=await this.open();return await new Promise(res=>{const q=db.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(undefined)})}catch(e){return undefined}},
  async set(k,v){try{const db=await this.open();await new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').put(v,k);tx.oncomplete=res;tx.onerror=res})}catch(e){}},
  async del(k){try{const db=await this.open();await new Promise(res=>{const tx=db.transaction('kv','readwrite');tx.objectStore('kv').delete(k);tx.oncomplete=res;tx.onerror=res})}catch(e){}}
};

/* ============================== settings ============================== */
const DEFAULTS={
  leadDays:15,      // days between placing an order and receiving it
  safetyDays:7,     // extra buffer days
  coverDays:30,     // after the stock arrives, buy enough for this many days
  basisDays:90,     // sales window used for average daily sale
  moqBasis:'ly',    // automatic MOQ when the Item Master has none: 'ly' = same months last year, 'recent' = latest months
  moqMonths:3,      // MOQ = average monthly sale over this many months
  minBills:2,       // an item must have at least this many sale bills in the sales window to appear in Buy Now
  nmDays:180,       // no sale for this many days = non-moving
  fastBills:24,     // 24+ sale bills in 365 days = fast moving
  excessDays:180,   // stock covering more than this many days of sale = excess
  exclude:'BED DEBTS|BAD DEBTS|DISCOUNT|ROUND OFF|FREIGHT|TRANSPORT|CARTAGE|LABOUR|GST'
};
let SET=Object.assign({},DEFAULTS,store.get('settings',{}));

/* ============================== state ============================== */
const S={files:{Payment:null,Receipt:null,Journal:null,Master:null,Opening:null},base:null,A:null,tab:'overview',from:null,to:null,preset:'90',source:null,srcAt:null,hosted:null,locked:false,unlockErr:'',charts:{},tstate:{}};


/* ============================== categories ============================== */
// Categories come only from the Category column of the Item Master (Google Sheet tab "Items").
const NO_CAT='Not set';
const dupKey=n=>n.toUpperCase().replace(/FERTILISER/g,'FERTILIZER').replace(/SEEDS/g,'SEED').replace(/[^A-Z0-9\/.]/g,'');

/* ============================== base model (on load) ============================== */
// Dates from the Google Sheet can arrive as 2026-11-02, as an ISO time, or as a full date text
// ("Mon Nov 02 2026 00:00:00 GMT+0530"), depending on the script version. All mean the sheet's own day.
function sheetDay(v){
  if(v==null||v==='')return null;
  if(typeof v==='number')return toDay(v);
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m)return Math.floor(Date.UTC(+m[1],+m[2]-1,+m[3])/864e5);
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})T/);
  if(m){const t=Date.parse(s);if(!isNaN(t))return Math.floor((t+330*60000)/864e5)} // ISO time: take the India date
  m=s.match(/\b([A-Z][a-z]{2})\s+(\d{1,2})\s+(\d{4})\b/);
  if(m){const mi=MON.indexOf(m[1]);if(mi>=0)return Math.floor(Date.UTC(+m[3],mi,+m[2])/864e5)}
  const d=toDay(s);return d==null||isNaN(d)?null:d;
}
function buildBase(){
  // Item master: the Google Sheet "Items" tab, on top of any Excel Item Master loaded
  const M0=Object.assign({},S.files.Master?S.files.Master.items:{});
  for(const [n,m] of Object.entries(sheetItemMaster())){const o=Object.assign({},M0[n]||{name:n});for(const k in m)if(m[k]!==null&&m[k]!==undefined&&m[k]!=='')o[k]=m[k];M0[n]=o}
  let exRe=null;try{exRe=SET.exclude.trim()?new RegExp('^('+SET.exclude+')$','i'):null}catch(e){exRe=null}
  // Trial Balance closing quantities become a stock count on its date, unless the Item Master gives opening or physical stock
  const M=Object.assign({},M0);let tbN=0;
  if(S.files.Opening){const O=S.files.Opening;for(const [n0,q] of Object.entries(O.items)){
    const n=(M0[n0]&&M0[n0].merge)||n0;if((exRe&&exRe.test(n))||(M0[n]&&M0[n].exclude))continue;const m=M[n];
    if(m&&!m.fromTB&&(m.open!=null||m.phys!=null))continue;
    M[n]=Object.assign({name:n},m||{},{phys:(m&&m.fromTB?m.phys:0)+q,cdate:O.asOn,fromTB:true});tbN++}}
  const alias=n=>{const m=M[n];return m&&m.merge?m.merge:n};
  const excluded=new Map(),lines=[],vouchers=[],contra=new Map();
  // Receipt = stock in, Payment = stock out; Journal lines are adjustments that change stock but are not purchases or sales
  for(const kind of ['Receipt','Payment','Journal']){
    const f=S.files[kind];if(!f)continue;const adj=kind==='Journal';const t0=kind==='Receipt'?1:-1;
    for(const v of f.vouchers){
      const party=adj?(cleanParty(v.party)==='(NO NAME)'?'JOURNAL ADJUSTMENT':cleanParty(v.party)):cleanParty(v.party);
      const vo={d:v.d,t:adj?0:t0,adj,vno:v.vno,party,rawParty:v.party,n:v.items.length,cond:v.cond,cancel:v.cancel};
      vouchers.push(vo);if(v.cancel)continue;
      v.contra.forEach(c=>contra.set(c,(contra.get(c)||0)+1));
      for(const [n0,q0] of v.items){const n=alias(n0);
        if((M[n]&&M[n].exclude)||(exRe&&exRe.test(n))){excluded.set(n,(excluded.get(n)||0)+1);continue}
        const t=adj?(q0>0?1:-1):t0,q=Math.abs(q0);
        lines.push({d:v.d,t,item:n,q,vno:v.vno,party,cond:v.cond,adj,v:vo});
      }
    }
  }
  const tallyEnd=vouchers.length?Math.max(...vouchers.map(v=>v.d)):null;
  // entries made on the New Entry page (Google Sheet): Inward / Outward like Tally, Adjustment like the Journal
  const app=S.files.App;let appN=0,badDate=0;const allRows=[];
  if(app){const g=new Map();for(const r of app.rows){if(/deleted/i.test(r.status||''))continue;if(!g.has(r.id))g.set(r.id,[]);g.get(r.id).push(r)}
    for(const rs of g.values()){const r0=rs[0];const d=sheetDay(r0.date);if(d==null){badDate+=rs.length;continue}
      const ty=/^in/i.test(r0.type)?'IN':/^out/i.test(r0.type)?'OUT':'ADJ',adj=ty==='ADJ',t0=ty==='IN'?1:-1;
      const party=r0.party?cleanParty(r0.party):adj?'STOCK ADJUSTMENT':'(NO NAME)';
      const vo={d,t:adj?0:t0,adj,app:true,id:r0.id,vno:r0.bill||('APP-'+r0.id),party,rawParty:(r0.party||'')+' '+(r0.narration||''),n:rs.length,cond:false,cancel:false};
      vouchers.push(vo);appN++;
      for(const r of rs){if(adj&&/^\*?\s*all items\s*\*?$/i.test(cleanName(r.item))&&r.counted!=null&&isFinite(+r.counted)){allRows.push({d,vo,party,counted:+r.counted});continue}
        const n=alias(cleanName(r.item));const q0=+r.qty;if(!n||!q0||!isFinite(q0))continue;
        if((M[n]&&M[n].exclude)||(exRe&&exRe.test(n))){excluded.set(n,(excluded.get(n)||0)+1);continue}
        lines.push({d,t:adj?(q0>0?1:-1):t0,item:n,q:Math.abs(q0),vno:vo.vno,party,cond:false,adj,app:true,v:vo,counted:adj&&r.counted!=null&&isFinite(+r.counted)?+r.counted:null})}}}
  // "ALL ITEMS" with a counted stock sets every item to that figure (used for a full stock reset)
  if(allRows.length){const names=new Set(lines.map(l=>l.item));for(const [n,m] of Object.entries(M))if(!m.exclude&&!m.merge)names.add(n);
    for(const a of allRows)for(const n of names)lines.push({d:a.d,t:1,item:n,q:0,vno:a.vo.vno,party:a.party,cond:false,adj:true,app:true,v:a.vo,counted:a.counted})}
  // a counted-stock adjustment applies after that day's other movements
  lines.sort((a,b)=>a.d-b.d||((a.counted!=null)-(b.counted!=null))||b.t-a.t);
  vouchers.sort((a,b)=>a.d-b.d);
  const byItem=new Map();for(const l of lines){if(!byItem.has(l.item))byItem.set(l.item,[]);byItem.get(l.item).push(l)}
  const live=vouchers.filter(v=>!v.cancel);
  const dMin=live.length?live[0].d:today();
  const dMax=Math.max(live.length?live[live.length-1].d:today(),app?today():0);
  S.base={lines,vouchers,excluded,contra,dMin,dMax,M,tbN,byItem,tallyEnd,appN,badDate};
}

/* ============================== analysis (on period / settings change) ============================== */
function analyse(){
  const B=S.base;if(!B)return;const M=B.M;
  const to=S.to,from=S.from,bd=SET.basisDays;
  const bStart=to-bd+1,prevStart=bStart-bd,y1=to-364,plen=to-from+1,ppStart=from-plen;
  const mDays=Math.max(1,Math.round((+SET.moqMonths||3)*30.42)),lyEnd=to-365,lyStart=lyEnd-mDays+1,recStart=to-mDays+1;
  const map=new Map();
  const get=n=>{let it=map.get(n);if(!it){const m=M[n]||null;
    it={name:n,m,cat:(m&&String(m.cat||"").trim())||NO_CAT,unit:(m&&m.unit)||'',cum:0,cumFrom:0,cumCount:0,inP:0,outP:0,billsP:0,custP:new Set(),outPP:0,billsPP:0,
      outB:0,billsB:0,outPrev:0,outLY:0,outRec:0,out365:0,bills365:0,cust365:new Set(),inAll:0,outAll:0,adjInP:0,adjOutP:0,adjAll:0,lastSale:null,lastBuy:null,lastBuyQty:0,lastSup:'',first:null,suppliers:new Set(),negSince:null,minBal:Infinity,minBalD:null};
    map.set(n,it)}return it};
  for(const n in M){const m=M[n];if(!m.exclude&&!m.merge&&(m.open||m.phys||m.min))get(n)}
  const hasCount=Object.values(M).some(m=>m.phys!=null);
  if(hasCount)for(const l of B.lines){if(l.d>to)break;const m=M[l.item];if(m&&m.phys!=null&&l.d<=m.cdate)get(l.item).cumCount+=l.t*l.q}
  for(const it of map.values())it.K=it.m&&it.m.phys!=null?it.m.phys-it.cumCount:(it.m&&it.m.open)||0;
  // pass 2
  for(const l of B.lines){
    if(l.d>to)break;const it=get(l.item);
    if(it.K===undefined)it.K=it.m&&it.m.phys!=null?it.m.phys-it.cumCount:(it.m&&it.m.open)||0;
    // counted stock from the New Entry page: the adjustment is whatever brings stock to the counted figure
    if(l.counted!=null){const dq=Math.round((l.counted-(it.K+it.cum))*1000)/1000;l.t=dq>=0?1:-1;l.q=Math.abs(dq)}
    const net=l.t*l.q;it.cum+=net;if(l.d<from)it.cumFrom+=net;
    if(it.first==null)it.first=l.d;
    const bal=it.K+it.cum;
    if(bal<-1e-9){if(it.negSince==null)it.negSince=l.d}else it.negSince=null;
    if(bal<it.minBal){it.minBal=bal;it.minBalD=l.d}
    if(l.adj){it.adjAll+=l.t*l.q;if(l.d>=from){if(l.t>0)it.adjInP+=l.q;else it.adjOutP+=l.q}continue}
    if(l.t>0){it.inAll+=l.q;it.lastBuy=l.d;it.lastBuyQty=l.q;it.lastSup=l.party;it.suppliers.add(l.party);if(l.d>=from)it.inP+=l.q}
    else{
      it.outAll+=l.q;it.lastSale=l.d;
      if(l.d>=from){it.outP+=l.q;it.billsP++;it.custP.add(l.party)}
      else if(l.d>=ppStart){it.outPP+=l.q;it.billsPP++}
      if(l.d>=bStart){it.outB+=l.q;it.billsB++}else if(l.d>=prevStart)it.outPrev+=l.q;
      if(l.d>=lyStart&&l.d<=lyEnd)it.outLY+=l.q;if(l.d>=recStart)it.outRec+=l.q;
      if(l.d>=y1){it.out365+=l.q;it.bills365++;it.cust365.add(l.party)}
    }
  }
  const items=[...map.values()];
  // values for ABC
  const rated=items.filter(i=>i.m&&i.m.rate).length;const byValue=rated>=items.length*0.5&&rated>0;
  for(const it of items){
    const m=it.m||{};
    // quantities carry at most 3 decimals; rounding removes floating-point leftovers such as 1e-15
    it.close=Math.round((it.K+it.cum)*1000)/1000+0;it.openP=Math.round((it.K+it.cumFrom)*1000)/1000+0;
    it.ads=it.outB/bd;it.monthly=it.ads*30;
    it.lead=m.lead||SET.leadDays;
    it.cover=it.ads>0?Math.max(0,it.close)/it.ads:(it.close>0?Infinity:0);
    const mm=+SET.moqMonths||3,useLY=SET.moqBasis!=='recent'&&it.outLY>0;
    it.minSrc=m.min!=null?'Master':useLY?'Last year':'Recent';
    it.min=m.min!=null?m.min:Math.ceil((useLY?it.outLY:it.outRec)/mm);
    it.rop=Math.max(it.min,it.ads*(it.lead+SET.safetyDays));
    it.active=it.billsB>=SET.minBills;
    let target=Math.max(it.min,it.ads*(it.lead+SET.coverDays));if(m.max)target=Math.min(Math.max(target,it.min),m.max);
    it.suggest=Math.max(0,Math.ceil(target-Math.max(0,it.close)));
    it.buy=it.active&&it.close<=it.rop&&it.suggest>0;
    it.urg=!it.buy?0:it.close<=0?3:it.cover<it.lead?2:1;
    it.belowMin=it.min>0&&it.close<it.min;it.short=it.belowMin?it.min-it.close:0;
    it.neg=it.close<-1e-9;
    it.idle=it.lastSale==null?Infinity:to-it.lastSale;
    it.nonMoving=it.idle>SET.nmDays;
    it.fsn=it.nonMoving?'N':it.bills365>=SET.fastBills?'F':'S';
    it.excess=it.close>0&&((m.max&&it.close>m.max)||(it.ads>0&&it.cover>SET.excessDays));
    it.trend=it.outPrev>0?(it.outB-it.outPrev)/it.outPrev:(it.outB>0?null:0);
    it.value=byValue?(it.out365*(m.rate||0)):it.bills365;
    it.stockValue=m.rate?Math.max(0,it.close)*m.rate:null;
  }
  // ABC
  const sorted=items.filter(i=>i.value>0).sort((a,b)=>b.value-a.value);const tot=sorted.reduce((s,i)=>s+i.value,0);let c=0;
  items.forEach(i=>i.abc='C');for(const i of sorted){const share=c/tot;i.abc=share<0.7?'A':share<0.9?'B':'C';c+=i.value}
  items.forEach(i=>{if(i.value<=0)i.abc='–'});
  // parties
  const cust=new Map(),sup=new Map();
  for(const v of B.vouchers){
    if(v.cancel||v.adj||v.d>to)continue;const M2=v.t<0?cust:sup;
    let p=M2.get(v.party);if(!p){p={name:v.party,bills:0,lines:0,items:new Set(),first:v.d,last:v.d,billsPrev180:0,billsLast60:0,billsAll:0};M2.set(v.party,p)}
    p.billsAll++;p.last=Math.max(p.last,v.d);p.first=Math.min(p.first,v.d);
    if(v.d>=from){p.bills++;p.lines+=v.n}
    if(v.d>to-60)p.billsLast60++;else if(v.d>to-240)p.billsPrev180++;
  }
  for(const l of B.lines){if(l.d>to)break;if(l.d<from||l.adj)continue;const p=(l.t<0?cust:sup).get(l.party);if(p)p.items.add(l.item)}
  // monthly
  const months=new Map();
  for(const v of B.vouchers){if(v.cancel||v.adj)continue;const k=ym(v.d);let m=months.get(k);if(!m){m={k,sale:0,rec:0,saleLines:0,recLines:0,cond:0};months.set(k,m)}
    if(v.t<0){m.sale++;m.saleLines+=v.n;if(v.cond)m.cond++}else{m.rec++;m.recLines+=v.n}}
  S.A={moqLabel:SET.moqBasis!=='recent'?`average monthly sale in the same ${mDays} days last year (${dstr(lyStart)} to ${dstr(lyEnd)}); items with no sale then use the latest ${SET.moqMonths} months`:`average monthly sale in the latest ${SET.moqMonths} months (${dstr(recStart)} to ${dstr(to)})`,items,cust:[...cust.values()],sup:[...sup.values()],months:[...months.values()].sort((a,b)=>a.k-b.k),byValue,
    from,to,plen,bStart};
  S.A.health=healthChecks();
}

/* ============================== data health ============================== */
function healthChecks(){
  const B=S.base,A=S.A,out=[];const P=S.files.Payment,R=S.files.Receipt;
  const tally=!!(P||R);
  if(tally&&(!P||!R))out.push({lvl:'crit',t:`${!P?'Payment (outward)':'Receipt (inward)'} file not loaded`,p:'Stock balances need both files. Load the missing register with "Load / replace files".'});
  const hasOpen=S.files.Opening||(S.files.Master&&Object.values(S.files.Master.items).some(m=>m.open!=null||m.phys!=null));
  const negN=A.items.filter(i=>i.neg).length;
  if(B.badDate)out.push({lvl:'serious',t:`${B.badDate} rows in the Google Sheet were skipped`,p:'Their date could not be read. Check the Date column in the Entries sheet holds a real date.'});
  if(S.files.App)out.push({lvl:'info',t:`${B.appN} entries from the New Entry page`,p:`Read live from the Google Sheet. Inward adds stock, Outward is a sale, Adjustment changes stock only.`});
  else if(S.appState==='error')out.push({lvl:'warn',t:'Entries from the Google Sheet could not be loaded',p:S.appErr||'Refresh the page to try again.'});
  const J=S.files.Journal;
  if(J){const jl=B.lines.filter(l=>l.adj);const jo=jl.filter(l=>l.t<0).length,ji=jl.length-jo;
    out.push({lvl:'info',t:`${jl.length} bad-debt adjustments from the Journal register`,p:`${jo} lines wrote stock off and ${ji} added stock back, across ${new Set(jl.map(l=>l.item)).size} items. They change stock balances but not sales, purchases or averages. See them in Entries → Bad debts adjustments.`})}
  const O=S.files.Opening;
  if(O){const gap=B.dMin-O.asOn-1;
    out.push({lvl:gap>0?'warn':'info',t:`Opening stock from the Trial Balance as on ${dstr(O.asOn)}`,p:`Applied to ${B.tbN} items. ${gap>0?`The registers start on ${dstr(B.dMin)}, ${gap} days later, so movements in between are missing. Export the Trial Balance up to ${dstr(B.dMin-1)}.`:gap<0?`It is dated after the registers start, so it is treated as a stock count on that date.`:'It ends the day before the registers start, as it should.'} An Opening Stock or Physical Stock in the Item Master overrides it for that item.`})}
  if(tally&&!hasOpen)out.push({lvl:'serious',t:'Opening stock not entered',p:`The registers start on ${dstr(B.dMin)} and carry no opening balance, so ${negN} of ${A.items.length} items show negative stock. Download the Item Master, fill "Opening Stock" (as on ${dstr(B.dMin)}) or a "Physical Stock" with its "Count Date", and load it here once. MOQ, lead time and rate go in the same sheet.`,act:[['Download Item Master','master']]});
  // inward gap
  const ms=A.months.filter(m=>m.k<ym(B.dMax));
  if(tally&&ms.length>=4){
    const med=[...ms.map(m=>m.rec)].sort((a,b)=>a-b)[Math.floor(ms.length/2)];
    const low=A.months.filter(m=>m.rec<med*0.25);
    if(low.length&&med>=8){
      const runs=[];for(const m of low){const r=runs[runs.length-1];if(r&&r.end===m.k-1){r.end=m.k;r.n.push(m.rec)}else runs.push({start:m.k,end:m.k,n:[m.rec]})}
      runs.forEach(r=>out.push({lvl:'serious',t:`Inward entries look incomplete: ${ymLabel(r.start)}${r.end>r.start?' to '+ymLabel(r.end):''}`,
        p:`Only ${r.n.join(', ')} receipt voucher${r.n.length>1?'s per month':''} were found against a usual ${med} a month. If purchases in this period were not entered as Receipt vouchers, stock for those items will look lower than it really is, and Buy Now will over-suggest.`}));
    }
  }
  // condensed
  for(const f of [P,R]){if(!f)continue;const c=f.vouchers.filter(v=>v.cond);if(c.length){const d0=Math.min(...c.map(v=>v.d)),d1=Math.max(...c.map(v=>v.d));
    out.push({lvl:'serious',t:`${c.length} ${f.kind} vouchers exported in condensed form (${dstr(d0)} to ${dstr(d1)})`,p:`These rows show one item and one amount per voucher, without the item break-up. For bills with several items, only the first item is counted, against the full bill quantity. In Tally, open the ${f.kind} Register, press Alt+F5 (Detailed) and export again.`})}}
  // period mismatch
  if(P&&R&&P.pTo&&R.pTo&&P.pTo!==R.pTo)out.push({lvl:'info',t:'The two files cover different periods',p:`Payment file: ${P.periodText}. Receipt file: ${R.periodText}. Export both for the same period so stock is compared like for like.`});
  if(P&&R&&P.pFrom&&R.pFrom&&P.pFrom!==R.pFrom)out.push({lvl:'info',t:'The two files start on different dates',p:'Movements before the later start date are only partly captured.'});
  // cancelled
  const canc=B.vouchers.filter(v=>v.cancel).length;if(canc)out.push({lvl:'info',t:`${canc} cancelled vouchers ignored`,p:'Cancelled entries carry no quantity and are left out of every figure.'});
  // never received
  const nr=A.items.filter(i=>i.inAll===0&&i.outAll>0&&!(i.m&&(i.m.open||i.m.phys)));
  if(nr.length)out.push({lvl:'warn',t:`${nr.length} items were sold but never received in these files`,p:'These were sold from stock that existed before the files start, or the purchase was entered under a different item name. Check the item names or give them an opening stock.',act:[['Show list','neverIn']]});
  // duplicates
  const g=new Map();for(const i of A.items){const k=dupKey(i.name);if(!g.has(k))g.set(k,[]);g.get(k).push(i.name)}
  const dups=[...g.values()].filter(a=>a.length>1);
  if(dups.length)out.push({lvl:'warn',t:`${dups.length} groups of item names look like duplicates`,p:'Examples: '+dups.slice(0,4).map(a=>a.map(x=>'“'+x+'”').join(' = ')).join('; ')+'. Put the main name in the "Merge Into" column of the Item Master to combine them.',act:[['Show list','dups']]});
  S.dups=dups;
  // no category in the Item Master
  const noCat=A.items.filter(i=>i.cat===NO_CAT);
  if(noCat.length)out.push({lvl:'warn',t:`${noCat.length} items have no category`,p:'Categories come from the Item Master. Fill in the Category column for these items on Masters → Items, for example: '+noCat.slice(0,5).map(i=>'“'+i.name+'”').join(', ')+'.'});
  // excluded
  if(B.excluded.size)out.push({lvl:'info',t:`${B.excluded.size} non-stock ledgers left out`,p:[...B.excluded.keys()].join(', ')+'. Change the exclude list in Settings.'});
  // contra
  const oddC=[...B.contra.entries()].filter(([n])=>!/^(cash|bank|.*bank.*|petty cash)$/i.test(n));
  if(oddC.length)out.push({lvl:'warn',t:'Some vouchers have an unusual opposite ledger',p:'Treated as the money side and ignored for stock: '+oddC.slice(0,8).map(([n,c])=>`${n} (${c})`).join(', ')+'. If these are items, the entry was posted on the wrong side.'});
  const noName=B.vouchers.filter(v=>!v.cancel&&v.party==='(NO NAME)').length;
  if(noName)out.push({lvl:'info',t:`${noName} vouchers have no party in the narration`,p:'Customer and supplier lists group them under "(NO NAME)". Write the party name in the narration to track them.'});
  if(!out.some(o=>o.lvl==='crit'||o.lvl==='serious'))out.unshift({lvl:'good',t:'No major data issues found',p:tally?'Both registers loaded in detailed form.':'Entries and masters loaded from the Google Sheet.'});
  return out;
}

/* ============================== period ============================== */
function fyStart(d){const t=dObj(d);const y=t.getUTCMonth()>=3?t.getUTCFullYear():t.getUTCFullYear()-1;return Math.floor(Date.UTC(y,3,1)/864e5)}
function applyPreset(p){
  const B=S.base;const end=B?B.dMax:today();let f,t=end;
  if(/^\d+$/.test(p)){f=end-(+p)+1}
  else if(p==='month'){const k=ym(end);f=ymStart(k)}
  else if(p==='lmonth'){const k=ym(end)-1;f=ymStart(k);t=ymStart(k+1)-1}
  else if(p==='fy'){f=fyStart(end)}
  else if(p==='lfy'){t=fyStart(end)-1;f=fyStart(t)}
  else if(p==='all'){f=B?B.dMin:end-365}
  else return;
  S.from=f;S.to=t;
}
function syncPeriodUI(){
  $('#pPreset').value=S.preset;$('#pFrom').value=iso(S.from);$('#pTo').value=iso(S.to);
  $('#asOn').textContent=`Stock as on ${dstr(S.to)} · ${S.to-S.from+1} days in period`;
}

function tableHTML(id,cols,rows,opt={}){
  const st=S.tstate[id]||(S.tstate[id]={key:opt.sort||null,dir:opt.dir||-1,all:false});
  let rs=rows;
  if(st.key){const c=cols.find(c=>c.k===st.key);if(c){const val=c.sv||(r=>r[c.k]);rs=[...rows].sort((a,b)=>{let x=val(a),y=val(b);
    if(x==null||x==='–'||(typeof x==='number'&&isNaN(x)))x=st.dir>0?Infinity:-Infinity;if(y==null||y==='–'||(typeof y==='number'&&isNaN(y)))y=st.dir>0?Infinity:-Infinity;
    if(typeof x==='string'||typeof y==='string')return String(x).localeCompare(String(y))*st.dir;return (x-y)*st.dir})}}
  const lim=st.all?rs.length:(opt.limit||150);const shown=rs.slice(0,lim);
  const th=cols.map(c=>`<th class="${c.n?'n':''}" ${st.key===c.k?`aria-sort="${st.dir>0?'ascending':'descending'}"`:''}><button type="button" data-sort="${id}|${c.k}" title="${esc(c.tip||'Sort')}">${esc(c.l)}</button></th>`).join('');
  const body=shown.length?shown.map(r=>'<tr>'+cols.map(c=>{const v=c.f?c.f(r):esc(r[c.k]);const cl=[c.n?'n':'',c.cls?c.cls(r):'',c.item?'item':''].join(' ').trim();return `<td${cl?` class="${cl}"`:''}>${v}</td>`}).join('')+'</tr>').join('')

  const foot=opt.foot?`<tfoot><tr>${opt.foot}</tr></tfoot>`:'';
  S.exp[id]={cols,rows:rs,title:opt.title||id};
  return `<div class="tw"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody>${foot}</table></div>
    <div class="more">${rs.length>lim?`Showing ${lim} of ${fmtInt(rs.length)} <button class="btn sm" type="button" data-all="${id}">Show all</button>`:`${fmtInt(rs.length)} row${rs.length===1?'':'s'}`}</div>`;

  const s=stockOn(n,day);if(!s.known)return '<span style="color:var(--warn)">New item: it will be added to the list</span>';
  let t=`Stock on ${dstr(day)}: <b>${fmt(s.qty)}</b>`;
  const q=parseFloat(l.qty);
  if(D.type==='ADJ'&&isFinite(q))t+=D.mode==='set'?` → change ${q-s.qty>=0?'+':''}${fmt(q-s.qty)}`:` → ${fmt(s.qty+q)}`;
  else if(D.type==='OUT'&&isFinite(q)&&q>s.qty)t+=` <span style="color:var(--crit)">· more than in stock</span>`;
  return t;
}

async function saveEntry(){
  if(S.saving)return;readForm();const D=S.draft;const day=fromIso(D.date);
  const fail=m=>{S.entryErr=m;rerenderEntry();const e=$('#enErr');if(e)e.scrollIntoView({block:'center'})};
  if(isNaN(day))return fail('Enter the date of the entry.');
  if(day>today())return fail('The date cannot be in the future.');
  const filled=D.lines.filter(l=>cleanName(l.item)||String(l.qty).trim()!=='');
  if(!filled.length)return fail('Add at least one item with its quantity.');
  const lines=[];
  for(const l of filled){const item=cleanName(l.item);const q=parseFloat(l.qty);
    if(!item)return fail('One line has a quantity but no item.');
    if(!isFinite(q))return fail(`Enter a quantity for ${item}.`);
    if(D.type!=='ADJ'){if(q<=0)return fail(`Quantity for ${item} must be more than zero.`);lines.push({item,qty:q})}
    else if(D.mode==='set'){if(q<0)return fail(`Counted stock for ${item} cannot be negative.`);const diff=Math.round((q-stockOn(item,day).qty)*1000)/1000;if(diff!==0)lines.push({item,qty:diff,counted:q})}
    else{if(q===0)return fail(`Enter a non-zero adjustment for ${item}.`);lines.push({item,qty:q})}}
  if(!lines.length)return fail('The counted stock already matches for every item, so there is nothing to save.');
  if(!cleanName(D.by))return fail('Enter your name in "Entered by".');
  store.set('by',cleanName(D.by));
  S.saving=true;S.entryErr='';rerenderEntry();
  try{
    const j=await api('POST',{action:'add',entry:{date:D.date,type:D.type,party:D.type==='ADJ'?'':D.party,bill:D.type==='ADJ'?'':D.bill,narration:D.note,by:D.by,lines}});
    if(S.editId){const old=S.editId;S.editId=null;
      try{await api('POST',{action:'delete',id:old});toast('Entry updated')}
      catch(e){toast('Saved the new version, but the old one could not be removed. Delete it from the list.')}}
    else toast(`Saved ${j.lines} line${j.lines>1?'s':''} to the Google Sheet`);
    const keep={type:D.type,date:D.date,by:D.by,mode:D.mode};S.draft=Object.assign(newDraft(),keep);
    S.saving=false;await loadApp();
  }catch(e){S.saving=false;fail(e.code===503?'The Google Sheet connection is not set up yet.':'Not saved: '+e.message)}
}

async function handleFiles(list){
  const msg=$('#loadMsg');const done=[],errs=[];
  if(!window.XLSX){toast('The Excel reader did not load. Check the internet connection, or keep the lib folder next to this file.');return}
  for(const file of list){
    try{const buf=await file.arrayBuffer();const wb=XLSX.read(buf,{type:'array',cellDates:false});const f=parseWorkbook(wb,file.name);S.files[f.kind]=f;done.push(`${f.kind}: ${file.name}`)}
    catch(e){errs.push(e.message||String(e))}
  }
  if(errs.length){if(msg)msg.textContent=errs.join(' ');toast(errs[0])}
  if(!done.length)return;
  S.source='local';S.srcAt=Date.now();S.locked=false;
  await idb.set('files',{Payment:pack(S.files.Payment),Receipt:pack(S.files.Receipt),Journal:pack(S.files.Journal),Master:S.files.Master,Opening:S.files.Opening});
  boot(true);toast('Loaded '+done.join(', '));
}
function bindDrop(){const d=$('#drop');if(!d)return;

  ['dragleave','drop'].forEach(e=>d.addEventListener(e,ev=>{ev.preventDefault();d.classList.remove('over')}));
  d.addEventListener('drop',ev=>{if(ev.dataTransfer&&ev.dataTransfer.files.length)handleFiles([...ev.dataTransfer.files])});
}

  const co=(S.files.Payment&&S.files.Payment.company)||(S.files.Receipt&&S.files.Receipt.company);$('#coName').textContent=co||'Stock Control';
  const sb=$('#sampleBar');const showLocal=false;sb.hidden=!(S.source==='snapshot'||showLocal);
  if(S.source==='snapshot')$('#sampleText').textContent=`Showing the registers loaded on ${new Date(S.srcAt||Date.now()).toLocaleDateString('en-IN')} (${S.files.Payment?S.files.Payment.periodText:''}). Load newer Tally exports with "Load / replace files" to update.`;
  else if(showLocal)$('#sampleText').innerHTML=`Showing files loaded on this device on ${esc(new Date(S.srcAt).toLocaleString('en-IN'))}. The GitHub data was built on ${esc(new Date(S.hosted.builtAt).toLocaleString('en-IN'))}. <button class="btn sm" type="button" data-act="useHosted">Use the GitHub data</button>`;
}
function boot(resetPeriod){
  if(!S.files.Payment&&!S.files.Receipt&&!S.files.App){S.base=null;S.A=null;renderChips();render();return}
  buildBase();
  if(resetPeriod||!S.from){if(S.preset==='custom')S.preset='90';applyPreset(S.preset)}
  syncPeriodUI();analyse();renderChips();render();
}
function recalc(){analyse();render()}

/* ============================== events ============================== */
$('#fileInput').addEventListener('change',e=>{if(e.target.files.length)handleFiles([...e.target.files]);e.target.value=''});
$('#pPreset').addEventListener('change',e=>{S.preset=e.target.value;if(S.preset!=='custom'){applyPreset(S.preset);syncPeriodUI();recalc()}});
['#pFrom','#pTo'].forEach(id=>$(id).addEventListener('change',()=>{const f=fromIso($('#pFrom').value),t=fromIso($('#pTo').value);if(isNaN(f)||isNaN(t))return;
  S.from=Math.min(f,t);S.to=Math.max(f,t);S.preset='custom';syncPeriodUI();recalc()}));
$('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;setMenu(false);go(b.dataset.tab)});
$('#navToggle').addEventListener('click',()=>setMenu(!$('#side').classList.contains('open')));
$('#scrim').addEventListener('click',()=>setMenu(false));
document.addEventListener('keydown',e=>{if(e.key==='Escape')setMenu(false)});
function go(t){S.tab=t;render();window.scrollTo({top:0})}
$('#dlgClose').addEventListener('click',()=>{const d=$('#dlg');try{d.close()}catch(e){d.removeAttribute('open')}});
$('#dlg').addEventListener('close',()=>{if(S.charts.i){S.charts.i.destroy();delete S.charts.i}if(S.charts.b){S.charts.b.destroy();delete S.charts.b}});
document.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-item]');if(!t)return;
  if(t.closest('#entryPage')&&entryClick(t))return;
  if(t.dataset.mact&&masterClick(t))return;
  if(t.dataset.sort){const [id,k]=t.dataset.sort.split('|');const st=S.tstate[id];if(st.key===k)st.dir*=-1;else{st.key=k;st.dir=(['name','cat','party','item','lastSup','vno'].includes(k))?1:-1}rerenderFor(id);return}
  if(t.dataset.all){S.tstate[t.dataset.all].all=true;rerenderFor(t.dataset.all);return}
  if(t.dataset.item){openItem(t.dataset.item);return}
  if(t.dataset.go){go(t.dataset.go);return}
  if(t.dataset.copy){doCopy(t.dataset.copy);return}
  if(t.dataset.xlsx){doXlsx(t.dataset.xlsx);return}
  if(t.dataset.editentry){startEdit(t.dataset.editentry);return}
  if(t.dataset.party){closeDlg();S.f.eP=t.dataset.party;S.f.eQ='';S.f.eV='';saveF();go('entries');return}
  if(t.dataset.cat){S.f.sCat=t.dataset.cat;saveF();go('stock');return}
  if(t.dataset.abc){const [a,f]=t.dataset.abc.split('');S.f.sAbc=a;S.f.sFsn=f;S.f.sCat='';S.f.sQ='';saveF();go('stock');return}
  const act=t.dataset.act;
  if(act==='pick')$('#fileInput').click();
  else if(act==='master')downloadMaster();
  else if(act==='copyMaster')copyMaster();
  else if(act==='retryApp'){toast('Loading from the Google Sheet…');loadApp()}
  else if(act==='retrySheet'){openSheet()}
  else if(act==='neverIn'){S.f.sQ='';saveF();showList('Sold but never received',S.A.items.filter(i=>i.inAll===0&&i.outAll>0).map(i=>i.name))}
  else if(act==='dups')showList('Possible duplicate item names',S.dups.map(a=>a.join('  =  ')),true);
  if(t.id==='setReset'){SET=Object.assign({},DEFAULTS);store.set('settings',{});buildBase();recalc()}
  if(t.id==='dropMaster'){S.files.Master=null;idb.set('files',{Payment:pack(S.files.Payment),Receipt:pack(S.files.Receipt),Master:null,Opening:S.files.Opening,Journal:pack(S.files.Journal)});boot(false)}
});
function closeDlg(){const d=$('#dlg');if(d.open){try{d.close()}catch(e){d.removeAttribute('open')}}}
function showList(title,arr,plain){$('#dlgTitle').textContent=title;$('#dlgBody').innerHTML=`<div class="panel"><p class="muted" style="margin-top:0">${arr.length} entries${plain?'':'. Click an item to open its ledger.'}</p><div style="display:grid;gap:4px">${arr.map(n=>plain?`<div class="mono">${esc(n)}</div>`:`<div>${itemLink(n)}</div>`).join('')}</div></div>`;const d=$('#dlg');if(!d.open){try{d.showModal()}catch(e){d.setAttribute('open','')}}}
function rerenderFor(id){if(id.startsWith('it-')){const sc=$('#dlg').scrollTop;openItem(S.curItem);$('#dlg').scrollTop=sc}else{const y=window.scrollY;render();window.scrollTo(0,y)}}
function saveF(){}
let tmr=null;
document.addEventListener('input',e=>{const el=e.target;
  if(el.dataset&&el.dataset.set){const k=el.dataset.set;clearTimeout(tmr);tmr=setTimeout(()=>{SET[k]=(k==='exclude'||k==='moqBasis')?el.value:Math.max(0,+el.value||0);if(!SET[k]&&['basisDays','leadDays','moqMonths'].includes(k))SET[k]=DEFAULTS[k];store.set('settings',SET);if(k==='exclude')buildBase();analyse();renderTabs()},350);return}
  if(el.type==='search'&&el.id){clearTimeout(tmr);const id=el.id,pos=el.selectionStart;tmr=setTimeout(()=>{S.f[id]=el.value;saveF();Object.values(S.tstate).forEach(s=>s.all=false);render();const n=document.getElementById(id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}},250)}
});
document.addEventListener('submit',e=>{if(e.target.id==='entryForm'){e.preventDefault();saveEntry();return}if(e.target.id==='masterForm'){e.preventDefault();saveMaster();return}if(e.target.id==='colForm'){e.preventDefault();addColumn();return}});
document.addEventListener('change',e=>{const el=e.target;if(el.closest&&el.closest('#entryForm')){entryChanged(el);return}if(el.closest&&el.closest('#masterForm,#colForm,#docForm,#coForm'))return;if(!el.id||el.closest('#periodBar')||el.closest('#unlockForm')||el.dataset.set||el.type==='file'||el.type==='search')return;
  S.f[el.id]=el.type==='checkbox'?el.checked:el.value;saveF();render()});
if(window.matchMedia)window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>render());
new MutationObserver(()=>render()).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

/* ============================== start ============================== */
(async function start(){
  idb.del('files');
  store.set('pw',null);
  await openSheet();
})();
</script>
<script src="js/docs.js"></script>
